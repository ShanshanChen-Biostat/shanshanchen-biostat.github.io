{% assign current_section = page.url %}
{% case page.url %}
  {% when '/CircaCP.html', '/PiChange.html', '/MSSS.html', '/P-MSSS.html' %}
    {% assign current_section = '/Tools.html' %}
{% endcase %}
<nav class="top-nav" aria-label="Main navigation">
  {% for item in site.nav %}
  <a href="{{ item.url | relative_url }}"{% if current_section == item.url %} class="is-active" aria-current="{% if page.url == item.url %}page{% else %}location{% endif %}"{% endif %}>{{ item.title | escape }}</a>
  {% endfor %}
</nav>
